<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Patient | MediTrack</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef7ff;
}

.container{
    width:550px;
    margin:50px auto;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    color:#0284c7;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input, select{
    width:100%;
    padding:16px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border:2px solid #0284c7;
}

.btn{
    width:100%;
    background:#0284c7;
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    font-size:17px;
    cursor:pointer;
}

.btn:hover{
    background:#0369a1;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#0284c7;
}

</style>
</head>
<body>

<div class="container">

    <h1>➕ Add Patient</h1>

    <form method="POST">

        <div class="input-box">
            <label>Full Name</label>
            <input type="text"
                   name="fullname"
                   required>
        </div>

        <div class="input-box">
            <label>Age</label>
            <input type="number"
                   name="age"
                   required>
        </div>

        <div class="input-box">
            <label>Gender</label>

            <select name="gender" required>
                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>
                <option value="others">
                    Others
                </option>
            </select>

        </div>

        <div class="input-box">
            <label>Disease</label>
            <input type="text"
                   name="disease"
                   required>
        </div>

        <div class="input-box">
            <label>Phone</label>
            <input type="text"
                   name="phone"
                   required>
        </div>

        <button class="btn">
            Add Patient
        </button>

    </form>

    <a class="back"
       href="/patients">

       View Patients
    </a>

</div>

</body>
</html>
